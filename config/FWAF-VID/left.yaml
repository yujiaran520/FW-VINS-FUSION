%YAML:1.0
---
# 相机投影模型；PINHOLE 表示针孔模型。
model_type: PINHOLE
# 相机名称，仅用于区分和日志显示。
camera_name: fwaf_infra_left
# 标定对应的图像宽度，单位为像素。
image_width: 640
# 标定对应的图像高度，单位为像素。
image_height: 480
# 输入为 RealSense 已矫正的 image_rect_raw，畸变参数必须为零。
distortion_parameters:
   # 第一阶径向畸变系数。
   k1: 0.0
   # 第二阶径向畸变系数。
   k2: 0.0
   # 第一项切向畸变系数。
   p1: 0.0
   # 第二项切向畸变系数。
   p2: 0.0
# 针孔投影内参分组。
projection_parameters:
   # 水平方向焦距，单位为像素。
   fx: 390.7312927246094
   # 垂直方向焦距，单位为像素。
   fy: 390.7312927246094
   # 主点横坐标，单位为像素。
   cx: 319.97802734375
   # 主点纵坐标，单位为像素。
   cy: 238.85345458984375
